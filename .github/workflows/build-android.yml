name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 32 位（armeabi-v7a）与 64 位（arm64-v8a）都要出：
        # 中低端设备与行业终端仍有大量 32 位，SDK 的 abiFilters 也是两个都留
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Cache OpenCV build (Android ${{ matrix.abi }})
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /tmp/opencv-android-install-${{ matrix.abi }}
          key: opencv-4.13.0-android-${{ matrix.abi }}-v3

      # 缓存命中也要校验：安装目录缺 OpenCVConfig.cmake 就丢弃重建
      - name: Verify OpenCV install (Android ${{ matrix.abi }})
        id: opencv-check
        run: |
          INSTALL=/tmp/opencv-android-install-${{ matrix.abi }}
          if [ -f "$INSTALL/sdk/native/jni/OpenCVConfig.cmake" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "OpenCV 安装不完整，丢弃后重建"
            rm -rf "$INSTALL"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OpenCV from source (Android ${{ matrix.abi }})
        if: steps.cache-opencv.outputs.cache-hit != 'true' || steps.opencv-check.outputs.ok != 'true'
        run: |
          if [ ! -d /tmp/opencv-4.13.0 ]; then
            wget -q https://github.com/opencv/opencv/archive/refs/tags/4.13.0.zip -O /tmp/opencv-4.13.0.zip
            unzip -q /tmp/opencv-4.13.0.zip -d /tmp/
          fi
          mkdir -p /tmp/opencv-android-build-${{ matrix.abi }} && cd /tmp/opencv-android-build-${{ matrix.abi }}
          cmake /tmp/opencv-4.13.0 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc \
            -DWITH_KLEIDICV=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/opencv-android-install-${{ matrix.abi }} \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_PYTHON=OFF \
            -DBUILD_opencv_js=OFF -DBUILD_opencv_ts=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DWITH_IPP=OFF -DWITH_TBB=OFF -DWITH_OPENMP=OFF \
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF -DWITH_V4L=OFF -DWITH_GTK=OFF -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_AVIF=OFF -DWITH_WEBP=OFF -DWITH_JASPER=OFF \
            -DWITH_TIFF=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_OPENJPEG=OFF \
            -DWITH_IMGCODEC_HDR=OFF -DWITH_IMGCODEC_SUNRASTER=OFF \
            -DWITH_IMGCODEC_PXM=OFF -DWITH_IMGCODEC_PFM=OFF \
            -DENABLE_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev
          cmake --build . -j$(nproc)
          cmake --install .

      # OpenCV 的 install(EXPORT) 会列出 imgcodecs 的 3rdparty 目标（libtiff / libjpeg / libpng 等），
      # 而 BUILD_LIST=core,imgproc 已把这些模块裁掉、库根本没构建，
      # find_package 会因为「imported target 引用的文件不存在」直接失败。
      # 我们不使用 imgcodecs，链接器不会拉取这些库的符号，故用空归档占位补齐配置。
      - name: Patch missing OpenCV 3rdparty archives (Android ${{ matrix.abi }})
        run: |
          INSTALL=/tmp/opencv-android-install-${{ matrix.abi }}
          # 3rdparty 的真实路径写在 OpenCVModules-release.cmake 里；_IMPORT_PREFIX 由 CMake
          # 按「配置文件所在目录向上 N 级」计算（N = 文件里 get_filename_component 的调用次数），
          # release 文件本身不含该计算，沿用同目录主文件的值。
          EMPTY_O=/tmp/inksi_empty_$$.o
          cc -x c -c /dev/null -o "$EMPTY_O" 2>/dev/null || true
          {
            find "$INSTALL" -name "OpenCVModules*.cmake" | while IFS= read -r f; do
              n=$(grep -c 'get_filename_component(_IMPORT_PREFIX' "$f" 2>/dev/null || true)
              n=${n:-0}
              if [ "$n" -eq 0 ]; then
                n=$(grep -c 'get_filename_component(_IMPORT_PREFIX' "$(dirname "$f")/OpenCVModules.cmake" 2>/dev/null || true)
                n=${n:-0}
              fi
              [ "$n" -gt 0 ] || continue
              p=$(dirname "$f"); i=1
              while [ "$i" -lt "$n" ]; do p=$(dirname "$p"); i=$((i+1)); done
              echo "config=$(basename "$f") n=$n prefix=$p" >&2
              grep -oE '\$\{_IMPORT_PREFIX\}[^"\)]*\.a' "$f" 2>/dev/null \
                | sed "s|\${_IMPORT_PREFIX}|$p|g"
            done
            grep -rhoE "$INSTALL[^\"\)]*\.a" "$INSTALL" 2>/dev/null
          } | sort -u | while IFS= read -r lib; do
            if [ ! -f "$lib" ]; then
              mkdir -p "$(dirname "$lib")"
              if [ -f "$EMPTY_O" ]; then ar rcs "$lib" "$EMPTY_O"; else touch "$lib"; fi
              echo "placeholder: $lib"
            fi
          done
          rm -f "$EMPTY_O"

      - name: Build inksi_image for Android ${{ matrix.abi }}
        run: |
          mkdir -p build-android-${{ matrix.abi }} && cd build-android-${{ matrix.abi }}
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DOpenCV_DIR=/tmp/opencv-android-install-${{ matrix.abi }}/sdk/native/jni \
            -DINKSI_USE_OPENCV=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev
          cmake --build . -j$(nproc)

      - name: Merge OpenCV static libs into libinksi_image.a (${{ matrix.abi }})
        run: |
          cd build-android-${{ matrix.abi }}
          MRI=merge_opencv.mri
          # 关键：输出到临时名，避免 create 覆盖 CMake 编出的 libinksi_image.a（自身目标文件会全丢）
          echo "create libinksi_image_merged.a" > $MRI
          echo "addlib libinksi_image.a" >> $MRI
          # 占位库是我们补的空归档（含 x86_64 空对象），跳过以免污染目标架构
          find /tmp/opencv-android-install-${{ matrix.abi }} -name '*.a' \
            | grep -v -E '/(liblibprotobuf|libade)\.a$' \
            | sort | while read lib; do
            echo "addlib $lib" >> $MRI
          done
          echo "save" >> $MRI
          echo "end" >> $MRI
          ar -M < $MRI
          mv libinksi_image_merged.a libinksi_image.a
          rm -f $MRI
          echo "Merged. Size: $(ls -lh libinksi_image.a | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        with:
          name: inksi_image-android-${{ matrix.abi }}
          path: build-android-${{ matrix.abi }}/libinksi_image.a
      - name: Rename for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp build-android-${{ matrix.abi }}/libinksi_image.a inksi_image-android-${{ matrix.abi }}.a
        shell: bash
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: inksi_image-android-${{ matrix.abi }}.a
