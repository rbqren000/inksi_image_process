name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Cache OpenCV build (Android)
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /tmp/opencv-android-install
          key: opencv-4.13.0-android-arm64-v8a-v3

      # 缓存命中也要校验：安装目录缺 OpenCVConfig.cmake 就丢弃重建
      - name: Verify OpenCV install (Android)
        id: opencv-check
        run: |
          INSTALL=/tmp/opencv-android-install
          if [ -f "$INSTALL/sdk/native/jni/OpenCVConfig.cmake" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "OpenCV 安装不完整，丢弃后重建"
            rm -rf "$INSTALL"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OpenCV from source (Android arm64-v8a)
        if: steps.cache-opencv.outputs.cache-hit != 'true' || steps.opencv-check.outputs.ok != 'true'
        run: |
          wget -q https://github.com/opencv/opencv/archive/refs/tags/4.13.0.zip -O /tmp/opencv-4.13.0.zip
          unzip -q /tmp/opencv-4.13.0.zip -d /tmp/
          mkdir /tmp/opencv-android-build && cd /tmp/opencv-android-build
          cmake /tmp/opencv-4.13.0 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc \
            -DWITH_KLEIDICV=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/opencv-android-install \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_PYTHON=OFF \
            -DBUILD_opencv_js=OFF -DBUILD_opencv_ts=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DWITH_IPP=OFF -DWITH_TBB=OFF -DWITH_OPENMP=OFF \
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF -DWITH_V4L=OFF -DWITH_GTK=OFF -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_AVIF=OFF -DWITH_WEBP=OFF -DWITH_JASPER=OFF \
            -DWITH_TIFF=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_OPENJPEG=OFF \
            -DWITH_IMGCODEC_HDR=OFF -DWITH_IMGCODEC_SUNRASTER=OFF \
            -DWITH_IMGCODEC_PXM=OFF -DWITH_IMGCODEC_PFM=OFF \
            -DENABLE_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev
          cmake --build . -j$(nproc)
          cmake --install .

      # OpenCV 的 install(EXPORT) 会列出 imgcodecs 的 3rdparty 目标（libtiff / libjpeg / libpng 等），
      # 而 BUILD_LIST=core,imgproc 已把这些模块裁掉、库根本没构建，
      # find_package 会因为「imported target 引用的文件不存在」直接失败。
      # 我们不使用 imgcodecs，链接器不会拉取这些库的符号，故用空归档占位补齐配置。
      - name: Patch missing OpenCV 3rdparty archives (Android)
        run: |
          INSTALL=/tmp/opencv-android-install
          # Android 的 _IMPORT_PREFIX 指向 sdk/native（配置在 sdk/native/jni/abi-<abi>/ 下）
          PREFIX=$INSTALL/sdk/native
          MODULES=$(find "$INSTALL" -name "OpenCVModules*.cmake")
          echo "MODULES=$MODULES"
          echo "PREFIX=$PREFIX"
          # ar 拒绝空归档（no archive members），先编一个空对象再打包
          # 注意用 -x c 显式指定语言：mktemp 文件名无扩展名时 cc 会认不出
          EMPTY_O=/tmp/inksi_empty_$$.o
          cc -x c -c /dev/null -o "$EMPTY_O" 2>/dev/null || true
          echo "EMPTY_O exists: $([ -f "$EMPTY_O" ] && echo yes || echo no)"
          {
            # 配置里大多写作 ${_IMPORT_PREFIX}/...，必须展开成真实路径才能判断
            grep -ohE '\$\{_IMPORT_PREFIX\}[^"\)]*\.a' $MODULES 2>/dev/null \
              | sed "s|\${_IMPORT_PREFIX}|$PREFIX|g"
            # 少数位置直接写绝对路径
            grep -rhoE "$INSTALL[^\"\)]*\.a" "$INSTALL" 2>/dev/null
          } | sort -u | tee /tmp/inki_libs.txt
          echo "matched libs: $(wc -l < /tmp/inki_libs.txt)"
          while IFS= read -r lib; do
            if [ ! -f "$lib" ]; then
              mkdir -p "$(dirname "$lib")"
              if [ -f "$EMPTY_O" ]; then ar rcs "$lib" "$EMPTY_O"; else touch "$lib"; fi
              echo "placeholder: $lib"
            fi
          done < /tmp/inki_libs.txt
          rm -f "$EMPTY_O" /tmp/inki_libs.txt
          echo "=== 3rdparty 目录现状:"
          find "$INSTALL/sdk/native/3rdparty" -name "*.a" 2>/dev/null | head -10

      - name: Build inksi_image for Android arm64-v8a
        run: |
          mkdir -p build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DOpenCV_DIR=/tmp/opencv-android-install/sdk/native/jni \
            -DINKSI_USE_OPENCV=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev
          cmake --build . -j$(nproc)

      - name: Merge OpenCV static libs into libinksi_image.a
        run: |
          cd build-android
          MRI=merge_opencv.mri
          echo "create libinksi_image.a" > $MRI
          find /tmp/opencv-android-install -name '*.a' | sort | while read lib; do
            echo "addlib $lib" >> $MRI
          done
          echo "save" >> $MRI
          echo "end" >> $MRI
          ar -M < $MRI
          rm -f $MRI
          echo "Merged. Size: $(ls -lh libinksi_image.a | awk '{print $5}')"
      - uses: actions/upload-artifact@v4
        with:
          name: inksi_image-android-arm64-v8a
          path: build-android/libinksi_image.a
      - name: Rename for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp build-android/libinksi_image.a inksi_image-android-arm64-v8a.a
        shell: bash
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: inksi_image-android-arm64-v8a.a
