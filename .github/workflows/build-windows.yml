name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenCV build (Windows)
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv-windows-install
          key: opencv-4.13.0-windows-x86_64-v3

      # 缓存命中也要校验：安装目录里必须有 OpenCVConfig.cmake，否则丢弃重建
      - name: Verify OpenCV install (Windows)
        id: opencv-check
        shell: pwsh
        run: |
          $install = "C:\opencv-windows-install"
          # 限定深度 3 的定向查找：覆盖 x64/<vcXX>/staticlib（VS 2026 是 vc18）等布局。
          # 不用无限递归——安装目录含数千文件，Windows runner 慢 IO 下要 2 分钟以上。
          $ok = (Get-ChildItem -Path $install -Filter "OpenCVConfig.cmake" -Recurse -Depth 3 -ErrorAction SilentlyContinue).Count -gt 0
          if ($ok) {
            echo "ok=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "OpenCV 安装不完整，丢弃后重建"
            Remove-Item -Recurse -Force $install -ErrorAction SilentlyContinue
            echo "ok=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build OpenCV from source (Windows x86_64)
        if: steps.cache-opencv.outputs.cache-hit != 'true' || steps.opencv-check.outputs.ok != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o "${{ runner.temp }}\opencv-4.13.0.zip" https://github.com/opencv/opencv/archive/refs/tags/4.13.0.zip
          7z x "${{ runner.temp }}\opencv-4.13.0.zip" -o"${{ runner.temp }}" -y
          mkdir "${{ runner.temp }}\opencv-win-build"
          cd "${{ runner.temp }}\opencv-win-build"
          # 注意：PowerShell 会把参数里的逗号当数组/参数列表分隔符，
          # -DBUILD_LIST=core,imgproc 必须整体加引号，否则 ParserError
          cmake "${{ runner.temp }}\opencv-4.13.0" `
            "-DBUILD_SHARED_LIBS=OFF" `
            "-DBUILD_LIST=core,imgproc" `
            -DCMAKE_INSTALL_PREFIX=C:\opencv-windows-install `
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF `
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_PYTHON=OFF `
            -DBUILD_opencv_js=OFF -DBUILD_opencv_ts=OFF `
            -DWITH_IPP=OFF -DWITH_TBB=OFF -DWITH_OPENMP=OFF `
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_FFMPEG=OFF `
            -DWITH_GSTREAMER=OFF -DWITH_V4L=OFF -DWITH_GTK=OFF -DWITH_QT=OFF `
            -DWITH_OPENEXR=OFF `
            -DWITH_AVIF=OFF -DWITH_WEBP=OFF -DWITH_JASPER=OFF `
            -DWITH_TIFF=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_OPENJPEG=OFF `
            -DWITH_IMGCODEC_HDR=OFF -DWITH_IMGCODEC_SUNRASTER=OFF `
            -DWITH_IMGCODEC_PXM=OFF -DWITH_IMGCODEC_PFM=OFF `
            -DWITH_EIGEN=OFF `
            -DENABLE_PRECOMPILED_HEADERS=OFF `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release -j
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install . --config Release

      # OpenCV 的 install(EXPORT) 会列出 imgcodecs/dnn 的 3rdparty 目标（libprotobuf 等），
      # 而这些模块已被 BUILD_LIST 裁掉、库未构建，find_package 会因缺文件失败。
      # 不使用 imgcodecs/dnn，链接器不会拉取这些符号，用空 .lib 占位补齐配置。
      # lib.exe 需要 VS 环境，用 msvc-dev-cmd 激活。
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Patch missing OpenCV 3rdparty libs (Windows)
        shell: pwsh
        run: |
          $install = "C:\opencv-windows-install"
          # _IMPORT_PREFIX 由 CMake 按「配置文件目录向上 N 级」计算（N = get_filename_component 次数），
          # Windows 的配置在 x64/vc18/staticlib 下，prefix 并不是 install 根，必须推导。
          # 先编一个空 .obj：lib.exe 无输入时不一定能生成合法库，而非法 .lib 会让 link.exe 直接报错
          $emptyC = Join-Path $env:TEMP "inksi_empty.c"
          $emptyObj = Join-Path $env:TEMP "inksi_empty.obj"
          Set-Content -Path $emptyC -Value "" -Encoding ASCII
          cl.exe /nologo /c "$emptyC" /Fo"$emptyObj" 2>$null | Out-Null
          Write-Host "empty obj: $(Test-Path $emptyObj)"

          $mods = Get-ChildItem -Path $install -Filter "OpenCVModules*.cmake" -Recurse -Depth 4 -ErrorAction SilentlyContinue
          foreach ($f in $mods) {
            $n = (Select-String -Path $f.FullName -Pattern 'get_filename_component\(_IMPORT_PREFIX').Count
            if ($n -eq 0) {
              $main = Join-Path $f.DirectoryName "OpenCVModules.cmake"
              if (Test-Path $main) {
                $n = (Select-String -Path $main -Pattern 'get_filename_component\(_IMPORT_PREFIX').Count
              }
            }
            if ($n -le 0) { continue }
            $p = $f.DirectoryName
            for ($i = 1; $i -lt $n; $i++) { $p = Split-Path $p -Parent }
            Write-Host "config=$($f.Name) n=$n prefix=$p"
            $refs = Select-String -Path $f.FullName -Pattern '\$\{_IMPORT_PREFIX\}([^"\)]*\.lib)' -AllMatches |
              ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($rel in $refs) {
              $full = Join-Path $p $rel
              if (-not (Test-Path $full)) {
                New-Item -ItemType Directory -Force -Path (Split-Path $full) | Out-Null
                if (Test-Path $emptyObj) {
                  lib.exe /nologo /OUT:"$full" "$emptyObj" | Out-Null
                } else {
                  lib.exe /nologo /OUT:"$full" | Out-Null
                }
                if (-not (Test-Path $full)) { New-Item -ItemType File -Path $full | Out-Null }
                Write-Host "placeholder: $full"
              }
            }
          }

      - name: Build inksi_image for Windows x86_64
        shell: pwsh
        run: |
          mkdir build-windows
          cd build-windows
          cmake .. -DINKSI_USE_OPENCV=ON -DOpenCV_DIR="C:\opencv-windows-install" -DOpenCV_STATIC=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release -j
      - uses: actions/upload-artifact@v4
        with:
          name: inksi_image-windows-x86_64
          path: build-windows/Release/inksi_image.dll
      - name: Rename for Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Copy-Item build-windows/Release/inksi_image.dll inksi_image-windows-x86_64.dll
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: inksi_image-windows-x86_64.dll
